<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 90" width="100" height="90" role="img" aria-label="PsyCool">
  <!-- Linhas (atrás dos círculos): cada uma com a cor de quem "envia" -->
  <!-- Empresa (topo) → Colaborador (esquerda): cor da Empresa -->
  <line x1="50" y1="18" x2="20" y2="70" stroke="#4A6BD8" stroke-width="6" stroke-linecap="round"/>
  <!-- Psicólogo (direita) → Empresa (topo): cor do Psicólogo -->
  <line x1="80" y1="70" x2="50" y2="18" stroke="#9CA7E6" stroke-width="6" stroke-linecap="round"/>
  <!-- Colaborador (esquerda) → Psicólogo (direita): cor do Colaborador -->
  <line x1="20" y1="70" x2="80" y2="70" stroke="#C07F91" stroke-width="6" stroke-linecap="round"/>

  <!-- Círculos -->
  <circle cx="50" cy="18" r="13" fill="#4A6BD8"/> <!-- Empresa -->
  <circle cx="20" cy="70" r="13" fill="#C07F91"/> <!-- Colaborador -->
  <circle cx="80" cy="70" r="13" fill="#9CA7E6"/> <!-- Psicólogo -->
</svg>
